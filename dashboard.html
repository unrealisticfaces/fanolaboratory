<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Fano Laboratory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Glassmorphism Card Style for Dark Mode */
        .dash-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .dash-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }
        /* Notification Dropdown Customization */
        .dropdown-menu-dark .dropdown-item:hover {
            background-color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="bg-dark text-white">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="dashboard.html">Fano Laboratory</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="sales.html">Sales & Tracking</a></li>
                    <li class="nav-item"><a class="nav-link" href="queue.html">Queueing System</a></li>
                    <li class="nav-item"><a class="nav-link" href="audit.html">Audit Logs</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <span id="welcomeMessage" class="me-3 text-white fw-bold"></span>
                    
                    <div class="dropdown me-4">
                        <button class="btn btn-outline-warning btn-sm dropdown-toggle position-relative" type="button" id="notificationDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            🔔 Alerts
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="notificationCount" style="display: none;">
                                0
                            </span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow-lg" aria-labelledby="notificationDropdown" id="notificationList" style="min-width: 320px;">
                            <li><span class="dropdown-item text-muted text-center py-3">No urgent jobs</span></li>
                        </ul>
                    </div>

                    <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4 px-4">
        <h2 class="mb-4">Overview & Analytics</h2>
        
        <div class="row g-3 mt-2">
            <div class="col-xl col-md-4 col-sm-6">
                <div class="card dash-card p-3 shadow-lg">
                    <div class="text-white-50 small text-uppercase fw-bold mb-1">Sales Today</div>
                    <h3 class="card-text text-success mb-0" id="salesToday">₱0</h3>
                </div>
            </div>
            <div class="col-xl col-md-4 col-sm-6">
                <div class="card dash-card p-3 shadow-lg">
                    <div class="text-white-50 small text-uppercase fw-bold mb-1">Sales This Month</div>
                    <h3 class="card-text text-info mb-0" id="salesMonth">₱0</h3>
                </div>
            </div>
            <div class="col-xl col-md-4 col-sm-6">
                <div class="card dash-card p-3 shadow-lg">
                    <div class="text-white-50 small text-uppercase fw-bold mb-1">Pending Payments</div>
                    <h3 class="card-text text-danger mb-0" id="pendingPayments">₱0</h3>
                </div>
            </div>
            <div class="col-xl col-md-6 col-sm-6">
                <div class="card dash-card p-3 shadow-lg">
                    <div class="text-white-50 small text-uppercase fw-bold mb-1">Jobs in Progress</div>
                    <h3 class="card-text text-warning mb-0" id="jobsInProgress">0</h3>
                </div>
            </div>
            <div class="col-xl col-md-6 col-sm-6">
                <div class="card dash-card p-3 shadow-lg">
                    <div class="text-white-50 small text-uppercase fw-bold mb-1">Delivered Jobs</div>
                    <h3 class="card-text text-success mb-0" id="jobsDelivered">0</h3>
                </div>
            </div>
        </div>

        <div class="row mt-4 mb-5">
            <div class="col-12">
                <div class="card dash-card p-4 shadow-lg">
                    <h4 class="text-white mb-3">Daily Production Volume (Last 7 Days)</h4>
                    <canvas id="statusSalesChart" height="80"></canvas>
                </div>
            </div>
        </div> 
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
