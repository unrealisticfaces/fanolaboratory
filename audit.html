<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - Fano Laboratory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .table { font-size: 0.85rem; }
        .table > thead.table-dark > tr > th {
            background-color: #212529 !important; 
            color: #ffffff !important;
            font-weight: bold; border-bottom: none; white-space: nowrap;
        }
    </style>
</head>
<body class="bg-light text-dark">

     <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-white" href="dashboard.html">Fano Laboratory</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="sales.html">Sales & Records</a></li>
                    <li class="nav-item"><a class="nav-link" href="inprogress.html">In Progress</a></li>
                    <li class="nav-item"><a class="nav-link" href="duedate.html">Due Dates</a></li>
                    <li class="nav-item"><a class="nav-link" href="queue.html">Live Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="delivered.html">Delivered Log</a></li>
                    <li class="nav-item"><a class="nav-link active" href="audit.html">Audit Logs</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4 px-4">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
            <div class="d-flex align-items-center gap-3">
                <h2 class="text-dark fw-bold mb-0">System Audit Logs</h2>
                <button id="clearLogsBtn" class="btn btn-sm btn-danger fw-bold shadow-sm" style="display: none;">
                    Clear All Logs
                </button>
            </div>
            <div class="bg-secondary text-white px-4 py-2 rounded shadow-sm">
                <h4 class="mb-0 fw-bold">Total Logs: <span id="logCount">0</span></h4>
            </div>
        </div>

        <div class="row mb-4 g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label text-secondary fw-bold small text-uppercase">Filter by Action</label>
                <select id="actionFilter" class="form-select shadow-sm">
                    <option value="All">All Actions</option>
                    <option value="CREATE">Create</option>
                    <option value="UPDATE">Update</option>
                    <option value="DELETE">Delete</option>
                    <option value="PRINT">Print</option>
                    <option value="EXPORT">Export</option>
                </select>
            </div>
            <div class="col-md-9">
                <label class="form-label text-secondary fw-bold small text-uppercase">Search Logs</label>
                <input type="text" id="searchInput" class="form-control shadow-sm" placeholder="Search User, Doctor, or Details...">
            </div>
        </div>

        <div class="card bg-white shadow-sm mb-5 border-0">
            <div class="card-body p-0">
                <div class="table-responsive rounded">
                    <table class="table table-sm table-hover table-bordered align-middle text-nowrap mb-0 bg-white">
                        <thead class="table-dark">
                            <tr>
                                <th>Timestamp</th>
                                <th>User / Email</th>
                                <th>Action</th>
                                <th style="width: 60%;">Details</th>
                            </tr>
                        </thead>
                        <tbody id="auditLogBody" class="text-dark">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/audit.js"></script>
</body>
</html>
